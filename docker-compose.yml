version: "3.8"

services:

  api:
    build: .
    container_name: clinic_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db


  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clinic_db

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Pass123"
      MSSQL_PID: Developer

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql


volumes:
  sqlserver_data: